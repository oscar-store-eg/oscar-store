<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSCAR Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f4efe9;color:#1c1c1c}
header{background:#1c1c1c;color:#e3d3b4;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{letter-spacing:3px;font-size:18px}
header a{color:#e3d3b4;cursor:pointer;padding:4px 8px;border-radius:6px}header a.on{background:#3a3226}
main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid #eee;text-align:start;vertical-align:top}th{font-size:12px;color:#777}
input,select,textarea{padding:7px;border:1px solid #ccc;border-radius:6px;font:inherit;max-width:100%}button{padding:7px 12px;border:0;border-radius:6px;background:#1c1c1c;color:#fff;cursor:pointer;font:inherit}button.s{background:#d6c2a2;color:#1c1c1c}button.d{background:#b3202a}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k{background:#fff;border-radius:10px;padding:12px}.k b{display:block;font-size:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}label{font-size:12px;color:#555;display:block}.img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:#eee}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:#eee;font-size:12px}.err{color:#b3202a}
</style></head><body><div id="app"></div><script>
var TOK=sessionStorage.getItem('adm'),V='dash',cache={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(m,u,b){var r=await fetch('/api/admin'+u,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+TOK},body:b?JSON.stringify(b):undefined});var j=await r.json();if(r.status===401&&u!=='/login'){TOK=null;sessionStorage.removeItem('adm');render();throw new Error('auth')}if(!r.ok)throw new Error(j.error||'Error');return j}
function $(id){return document.getElementById(id)}
function render(){var A=$('app');if(!TOK){A.innerHTML='<main><div class="card" style="max-width:340px;margin:60px auto"><h2>OSCAR Admin</h2><label>Password</label><input id="pw" type="password" style="width:100%"><p class="err" id="e"></p><button onclick="login()">Sign in</button></div></main>';return}
 var tabs=[['dash','Dashboard'],['orders','Orders'],['products','Products'],['returns','Returns'],['coupons','Coupons'],['customers','Customers'],['settings','Settings']];
 A.innerHTML='<header><b>OSCAR</b>'+tabs.map(t=>'<a class="'+(V===t[0]?'on':'')+'" onclick="V=\''+t[0]+'\';render()">'+t[1]+'</a>').join('')+'<a onclick="TOK=null;sessionStorage.removeItem(\'adm\');render()" style="margin-inline-start:auto">Sign out</a></header><main id="m">Loading…</main>';
 VIEWS[V]().catch(e=>{if(e.message!=='auth')$('m').innerHTML='<p class="err">'+esc(e.message)+'</p>'})}
async function login(){try{var r=await api('POST','/login',{password:$('pw').value});TOK=r.token;sessionStorage.setItem('adm',TOK);render()}catch(e){$('e').textContent=e.message}}
var ST=['Pending','Confirmed','Processing','Packed','Shipped','Out for Delivery','Delivered','Cancelled'];
var VIEWS={
dash:async()=>{var s=await api('GET','/stats');$('m').innerHTML='<div class="g"><div class="k">Orders<b>'+s.orders+'</b></div><div class="k">Pending<b>'+s.pending+'</b></div><div class="k">Last 24h<b>'+s.today+'</b></div><div class="k">Revenue (EGP)<b>'+s.revenue.toLocaleString()+'</b></div><div class="k">Customers<b>'+s.customers+'</b></div><div class="k">Products<b>'+s.products+'</b></div></div><div class="card" style="margin-top:14px"><b>Low stock (5 or fewer in total)</b><br>'+(s.lowStock.map(x=>esc(x.en)).join(', ')||'None')+'</div>'},
orders:async()=>{var o=await api('GET','/orders');$('m').innerHTML='<div class="card"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+o.map(x=>'<tr><td>'+x.id+'<br><small>'+new Date(x.t).toLocaleString()+'</small></td><td>'+esc(x.name)+'<br>'+esc(x.phone)+'<br><small>'+esc(x.addr.street)+', '+esc(x.addr.city||'')+' (gov '+x.addr.gov+')</small></td><td>'+x.items.map(i=>esc(i.en)+' '+esc(i.color)+'/'+esc(i.size)+' x'+i.qty).join('<br>')+'</td><td>'+x.total+' EGP<br><small>COD, '+x.payStatus+'</small></td><td><select onchange="setSt(\''+x.id+'\',this.value)">'+ST.map(s=>'<option'+(s===x.status?' selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</table></div>'},
products:async()=>{var p=await api('GET','/products');cache.p=p;$('m').innerHTML='<div class="row"><button onclick="editP()">+ Add product</button></div><div class="card"><table><tr><th></th><th>Product</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr>'+p.map(x=>'<tr><td>'+(x.images&&x.images[0]?'<img class="img" src="'+esc(x.images[0])+'">':'')+'</td><td>'+esc(x.en)+'<br><small>'+esc(x.ar)+' · '+esc(x.sku)+'</small></td><td>'+x.price+'</td><td>'+Object.values(x.stock||{}).reduce((a,b)=>a+b,0)+'</td><td>'+(x.active?'Yes':'No')+(x.demo?' <span class="tag">demo</span>':'')+'</td><td><button class="s" onclick="editP('+x.id+')">Edit</button></td></tr>').join('')+'</table></div>'},
returns:async()=>{var r=await api('GET','/returns');$('m').innerHTML='<div class="card"><table><tr><th>ID</th><th>Order</th><th>Item / type / reason</th><th>Status</th></tr>'+r.map(x=>'<tr><td>'+x.id+'</td><td>'+x.orderId+'</td><td>'+esc(x.item.en)+' '+esc(x.item.color)+'/'+esc(x.item.size)+' x'+x.item.qty+'<br><small>'+x.type+(x.newSize||x.newColor?' to '+esc(x.newColor)+'/'+esc(x.newSize):'')+' · '+esc(x.reason)+' '+esc(x.notes||'')+'</small></td><td><select onchange="retSt(\''+x.id+'\',this.value)">'+['Requested','Approved','Picked up','Completed','Rejected'].map(s=>'<option'+(s===x.status?' selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</table></div>'},
coupons:async()=>{var c=await api('GET','/coupons');$('m').innerHTML='<div class="card"><b>Add / update coupon</b><div class="row"><input id="cc" placeholder="CODE"><select id="ct"><option value="pct">% off</option><option value="fixed">Fixed EGP</option></select><input id="cv" type="number" placeholder="Value"><input id="cm" type="number" placeholder="Min order"><input id="cx" type="number" placeholder="Max uses"><input id="ce" placeholder="Label EN"><input id="ca" placeholder="Label AR"><button onclick="addC()">Save</button></div></div><div class="card"><table><tr><th>Code</th><th>Type</th><th>Value</th><th>Min</th><th></th></tr>'+c.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+x.type+'</td><td>'+x.val+'</td><td>'+(x.min||0)+'</td><td><button class="d" onclick="delC(\''+esc(x.code)+'\')">Delete</button></td></tr>').join('')+'</table></div>'},
customers:async()=>{var c=await api('GET','/customers');$('m').innerHTML='<div class="card"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Joined</th></tr>'+c.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.email)+'</td><td>'+new Date(x.createdAt).toLocaleDateString()+'</td></tr>').join('')+'</table></div>'},
settings:async()=>{var s=await api('GET','/settings');$('m').innerHTML='<div class="card"><div class="row"><div><label>Free shipping from (EGP)</label><input id="sf" type="number" value="'+s.freeShip+'"></div><div><label>Express fee (EGP)</label><input id="se" type="number" value="'+s.expressFee+'"></div><div><label>Return window (days)</label><input id="sr" type="number" value="'+s.returnDays+'"></div></div><b>Shipping zones (price EGP)</b><div class="row">'+Object.keys(s.zones).map(z=>'<div><label>Zone '+z+' ('+s.zones[z].days+' days)</label><input class="sz" data-z="'+z+'" type="number" value="'+s.zones[z].std+'"></div>').join('')+'</div><button onclick="saveS()">Save</button></div>'}};
async function setSt(id,s){try{await api('POST','/orders/'+id+'/status',{status:s});}catch(e){alert(e.message)}render()}
async function retSt(id,s){await api('POST','/returns/'+id,{status:s})}
async function addC(){try{await api('POST','/coupons',{code:$('cc').value,type:$('ct').value,val:+$('cv').value,min:+$('cm').value||0,max:+$('cx').value||1000,perUser:1,en:$('ce').value,ar:$('ca').value});render()}catch(e){alert(e.message)}}
async function delC(c){if(confirm('Delete '+c+'?')){await api('DELETE','/coupons/'+encodeURIComponent(c));render()}}
async function saveS(){var s=await api('GET','/settings');s.freeShip=+$('sf').value;s.expressFee=+$('se').value;s.returnDays=+$('sr').value;document.querySelectorAll('.sz').forEach(i=>s.zones[i.dataset.z].std=+i.value);await api('PUT','/settings',s);alert('Saved')}
var EP=null;
async function editP(id){var cats=await api('GET','/cats');EP=id?JSON.parse(JSON.stringify(cache.p.find(x=>x.id===id))):{en:'',ar:'',price:0,cat:'',colors:[],sizes:[],stock:{},images:[],active:true,descEn:'',descAr:''};
 EP.images=EP.images||[];EP.stock=EP.stock||{};EP._cats=cats.filter(c=>!c.virtual);drawP()}
function drawP(){var p=EP;var combos=[];p.colors.forEach(c=>p.sizes.forEach(s=>combos.push(c+'|'+s)));
 $('m').innerHTML='<div class="card"><h3>'+(p.id?'Edit product':'New product')+'</h3><div class="row"><div><label>Name EN</label><input id="pe" value="'+esc(p.en)+'"></div><div><label>Name AR</label><input id="pa" value="'+esc(p.ar)+'"></div><div><label>Price EGP</label><input id="pp" type="number" value="'+p.price+'"></div><div><label>Old price (optional)</label><input id="po" type="number" value="'+(p.old||'')+'"></div><div><label>Category</label><select id="pc">'+p._cats.map(c=>'<option value="'+c.id+'"'+(c.id===p.cat?' selected':'')+'>'+(c.parent?c.parent+' / ':'')+esc(c.en)+'</option>').join('')+'</select></div></div>'+
 '<div class="row"><div><label>Description EN</label><textarea id="pde" rows="3" cols="40">'+esc(p.descEn||'')+'</textarea></div><div><label>Description AR</label><textarea id="pda" rows="3" cols="40">'+esc(p.descAr||'')+'</textarea></div></div>'+
 '<div class="row"><div><label>Colors, comma separated, as English|Arabic|#hex (e.g. Black|أسود|#1c1c1c)</label><input id="pcol" value="'+esc(p.colors.map(k=>p.colorDefs&&p.colorDefs[k]?p.colorDefs[k].join('|'):k).join(','))+'" onchange="syncP()"></div><div><label>Sizes (comma separated)</label><input id="psz" value="'+esc(p.sizes.join(','))+'" onchange="syncP()"></div></div>'+
 '<label>Stock per color / size</label><div class="row">'+combos.map(k=>'<div><label>'+esc(k)+'</label><input class="st" data-k="'+esc(k)+'" type="number" min="0" style="width:80px" value="'+(p.stock[k]||0)+'"></div>').join('')+'</div>'+
 '<label>Photos</label><div class="row">'+p.images.map((u,i)=>'<span><img class="img" src="'+esc(u)+'"><br><a onclick="EP.images.splice('+i+',1);syncP()">remove</a></span>').join('')+'<input type="file" id="pf" accept="image/*" multiple onchange="upl()"></div>'+
 '<div class="row"><label><input type="checkbox" id="pact"'+(p.active?' checked':'')+'> Active</label><label><input type="checkbox" id="pnew"'+(p.isNew?' checked':'')+'> New</label><label><input type="checkbox" id="pbest"'+(p.isBest?' checked':'')+'> Best seller</label></div>'+
 '<p class="err" id="pe2"></p><button onclick="saveP()">Save</button> <button class="s" onclick="render()">Cancel</button>'+(p.id?' <button class="d" onclick="delP()">Delete</button>':'')+'</div>'}
function readP(){var p=EP;p.en=$('pe').value;p.ar=$('pa').value;p.price=+$('pp').value;p.old=+$('po').value||undefined;p.cat=$('pc').value;p.descEn=$('pde').value;p.descAr=$('pda').value;p.colorDefs=p.colorDefs||{};p.colors=$('pcol').value.split(',').map(x=>x.trim()).filter(Boolean).map(t=>{var a=t.split('|');if(a.length<2)return t;var k=a[0].trim().toLowerCase().replace(/[^a-z0-9]+/g,'');p.colorDefs[k]=[a[0].trim(),(a[1]||a[0]).trim(),(a[2]||'#cccccc').trim()];return k});p.sizes=$('psz').value.split(',').map(x=>x.trim()).filter(Boolean);
 document.querySelectorAll('.st').forEach(i=>p.stock[i.dataset.k]=+i.value||0);p.active=$('pact').checked;p.isNew=$('pnew').checked;p.isBest=$('pbest').checked;p.cats=[p.cat];var c=p._cats.find(x=>x.id===p.cat);if(c&&c.parent)p.cats.push(c.parent)}
function syncP(){readP();drawP()}
function shrink(f){return new Promise(ok=>{var r=new FileReader();r.onload=()=>{var im=new Image();im.onload=()=>{var m=1200,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(f)})}
async function upl(){readP();for(var f of $('pf').files){var d=await shrink(f);var r=await api('POST','/upload',{data:d});EP.images.push(r.url)}drawP()}
async function saveP(){readP();var o=Object.assign({},EP);delete o._cats;try{await api('POST','/products',o);V='products';render()}catch(e){$('pe2').textContent=e.message}}
async function delP(){if(confirm('Delete this product?')){await api('DELETE','/products/'+EP.id);V='products';render()}}
render();
</script></body></html>
